name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and preflight
    runs-on: ubuntu-latest
    env:
      AGENT_WORKFLOW_AUTH_SECRET_KEY: ci-auth-secret-change-in-production
      AGENT_WORKFLOW_ALLOW_DEV_ACTOR_HEADERS: "false"
      AGENT_WORKFLOW_AUTH_USERS_JSON: '{"admin":{"password_hash":"pbkdf2_sha256$310000$dqVxJw5rpq3Dy5ajkViIhA$vLrVR0yikxjUUvSW9HoTCSEcznaBmTpv3G7QRY2GfJE","actor_id":"admin-1","role":"workflow-admin","display_name":"CI Admin"}}'
      AGENT_WORKFLOW_SEED_EXAMPLE_WORKFLOW: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run production preflight
        run: python tools/preflight.py --profile production
      - name: Run tests
        run: pytest

  api-container:
    name: API container health
    runs-on: ubuntu-latest
    needs: backend
    env:
      AGENT_WORKFLOW_AUTH_SECRET_KEY: ci-auth-secret-change-in-production
      AGENT_WORKFLOW_ALLOW_DEV_ACTOR_HEADERS: "false"
      AGENT_WORKFLOW_AUTH_USERS_JSON: '{"admin":{"password_hash":"pbkdf2_sha256$310000$dqVxJw5rpq3Dy5ajkViIhA$vLrVR0yikxjUUvSW9HoTCSEcznaBmTpv3G7QRY2GfJE","actor_id":"admin-1","role":"workflow-admin","display_name":"CI Admin"}}'
      AGENT_WORKFLOW_SEED_EXAMPLE_WORKFLOW: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t agent-workflow-builder-api .
      - name: Start API image
        run: |
          docker run -d --rm \
            --name agent-workflow-builder-api \
            -p 8000:8000 \
            -e AGENT_WORKFLOW_DATABASE_URL=sqlite:////data/agent_workflow_builder.sqlite3 \
            -e AGENT_WORKFLOW_AUTH_SECRET_KEY="$AGENT_WORKFLOW_AUTH_SECRET_KEY" \
            -e AGENT_WORKFLOW_ALLOW_DEV_ACTOR_HEADERS="$AGENT_WORKFLOW_ALLOW_DEV_ACTOR_HEADERS" \
            -e AGENT_WORKFLOW_AUTH_USERS_JSON="$AGENT_WORKFLOW_AUTH_USERS_JSON" \
            -e AGENT_WORKFLOW_SEED_EXAMPLE_WORKFLOW="$AGENT_WORKFLOW_SEED_EXAMPLE_WORKFLOW" \
            agent-workflow-builder-api
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            docker logs agent-workflow-builder-api || true
            sleep 2
          done
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build dashboard
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
