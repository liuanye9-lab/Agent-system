[project]
name = "agent-workflow-builder"
version = "0.1.0"
description = "Project-grade foundation for compiling business know-how into executable Agent workflow packages."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "jsonschema>=4.22.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.scripts]
agent-workflow-preflight = "packages.workflow_core.ops.preflight:main"
agent-workflow-retention = "packages.workflow_core.ops.retention:main"
agent-workflow-snapshot = "packages.workflow_core.ops.snapshot:main"
agent-workflow-password = "packages.workflow_core.security.passwords:main"
agent-workflow-smoke = "packages.workflow_core.ops.smoke:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/workflow_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
